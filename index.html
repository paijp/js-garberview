<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gerberview</title>
<style>
  :root { --bg: #2b2b2b; --panel: #f4f4f4; --line: #ccc; --text: #222; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: sans-serif; font-size: 13px; color: var(--text); }
  body { display: flex; flex-direction: column; background: var(--bg); }
  body.light { --bg: #ffffff; }
  body.light #drop { color: #666; border-color: #aaa; }
  header { padding: 6px 12px; background: #eee; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  header h1 { font-size: 14px; margin: 0 6px 0 0; }
  header button, header label.file { font-size: 12px; padding: 3px 10px; border: 1px solid var(--line); background: #fff; cursor: pointer; border-radius: 3px; }
  header .group { display: flex; gap: 0; }
  header .group button { border-radius: 0; margin-left: -1px; }
  header .group button.on { background: #444; color: #fff; }
  header input[type=file] { display: none; }
  #main { flex: 1 1 0; display: flex; min-height: 0; }
  #layers { width: 240px; background: var(--panel); border-right: 1px solid var(--line); overflow: auto; padding: 6px 0; }
  #layers .row { display: flex; align-items: center; gap: 6px; padding: 3px 8px; }
  #layers .row .name { flex: 1 1 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #layers .row select { font-size: 11px; max-width: 92px; }
  #layers .row input[type=color] { width: 22px; height: 18px; padding: 0; border: none; background: none; }
  #layers .row.err .name { color: #c00; }
  #layers .empty { padding: 8px; color: #777; }
  #stage { flex: 1 1 0; position: relative; overflow: hidden; touch-action: none; }
  #stage svg { position: absolute; left: 0; top: 0; }
  #drop { position: absolute; inset: 20px; border: 2px dashed #888; border-radius: 8px; color: #bbb; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 16px; line-height: 1.8; pointer-events: none; }
  #stage.drag #drop { border-color: #fc0; color: #fc0; }
  footer { padding: 3px 12px; background: #eee; border-top: 1px solid var(--line); font-size: 12px; display: flex; gap: 16px; white-space: nowrap; overflow: hidden; }
  @media (max-width: 640px) { #layers { display: none; } }
</style>
</head>
<body>
<header>
  <h1>gerberview</h1>
  <label class="file">ZIP / ファイルを開く<input type="file" id="file" multiple accept=".zip,.gbr,.ger,.drl,.txt,.xln,.grb,*"></label>
  <span class="group" id="modes">
    <button data-mode="top" class="on">部品面</button><button data-mode="bottom">半田面</button><button data-mode="layers">レイヤー</button>
  </span>
  <button id="fit">全体表示</button>
  <span class="group" id="themes">
    <button data-theme="dark" class="on">黒背景</button><button data-theme="light">白背景</button>
  </span>
</header>
<div id="main">
  <div id="layers"><div class="empty">ファイルが読み込まれていません</div></div>
  <div id="stage">
    <svg id="view" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="drop">ガーバー一式の ZIP（または個別ファイル）をここにドロップ<br>
      ホイール: 拡大縮小 / ドラッグ: 移動 / Shift+ドラッグ: 距離の計測<br>
      <span id="privacy">ファイルはブラウザ内だけで処理され、どこにも送信されません</span></div>
  </div>
</div>
<footer><span id="pos">X: - Y: -</span><span id="meas"></span><span id="size"></span><span id="msg"></span></footer>
<script>
"use strict";
// @@lib-begin
/* ---------- ZIP reader ----------
   Reads the central directory and inflates with the browser's own
   DecompressionStream, so there is no library to bundle. */
async function inflateRaw(bytes) {
  const ds = new DecompressionStream("deflate-raw");
  const stream = new Blob([bytes]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function readZip(buf) {
  const u8 = new Uint8Array(buf);
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 22 - 65535); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("ZIP の終端が見つかりません");
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const out = [];
  const utf8 = new TextDecoder("utf-8");
  for (let n = 0; n < count; n++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error("ZIP の中央ディレクトリが壊れています");
    const method = dv.getUint16(p + 10, true);
    const csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    const loff = dv.getUint32(p + 42, true);
    const name = utf8.decode(u8.subarray(p + 46, p + 46 + nlen));
    p += 46 + nlen + xlen + clen;
    if (name.endsWith("/")) continue;
    const lnlen = dv.getUint16(loff + 26, true), lxlen = dv.getUint16(loff + 28, true);
    const start = loff + 30 + lnlen + lxlen;
    const raw = u8.subarray(start, start + csize);
    let data;
    if (method === 0) data = raw.slice();
    else if (method === 8) data = await inflateRaw(raw);
    else { out.push({ name, error: "未対応の圧縮方式 " + method }); continue; }
    out.push({ name, data });
  }
  return out;
}
function bytesToText(data) {
  return new TextDecoder("latin1").decode(data);
}

/* ---------- geometry items ----------
   Both parsers produce a list of items in mm, Y up:
     { pol: "D"|"C", kind: "stroke", width, path }   path traced with a round pen
     { pol: "D"|"C", kind: "fill", path }             nonzero fill
   A path is a list of commands: ["M",x,y] ["L",x,y] ["A",cx,cy,r,a0,a1,ccw] ["Z"].
   Every closed shape is wound counterclockwise and holes clockwise, so one
   nonzero fill can carry a whole run of same-polarity shapes. */
function circlePath(x, y, r, ccw) {
  return [["M", x + r, y], ["A", x, y, r, 0, Math.PI * 2, !ccw], ["Z"]];
}
function polyPath(pts, wantCcw) {
  let a = 0;
  for (let i = 0; i < pts.length; i++) {
    const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % pts.length];
    a += x1 * y2 - x2 * y1;
  }
  const list = ((a >= 0) === wantCcw) ? pts : pts.slice().reverse();
  const path = [["M", list[0][0], list[0][1]]];
  for (let i = 1; i < list.length; i++) path.push(["L", list[i][0], list[i][1]]);
  path.push(["Z"]);
  return path;
}
function rotPt(x, y, deg) {
  if (!deg) return [x, y];
  const r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r);
  return [x * c - y * s, x * s + y * c];
}
function convexHull(pts) {
  const p = pts.slice().sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const cross = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const lo = [], hi = [];
  for (const q of p) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (hi.length >= 2 && cross(hi[hi.length - 2], hi[hi.length - 1], q) <= 0) hi.pop(); hi.push(q); }
  return lo.slice(0, -1).concat(hi.slice(0, -1));
}
function itemsBBox(items) {
  const b = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
  const add = (x, y, m) => {
    if (x - m < b.minX) b.minX = x - m; if (x + m > b.maxX) b.maxX = x + m;
    if (y - m < b.minY) b.minY = y - m; if (y + m > b.maxY) b.maxY = y + m;
  };
  for (const it of items) {
    if (it.pol !== "D") continue;
    const m = it.kind === "stroke" ? it.width / 2 : 0;
    for (const c of it.path) {
      if (c[0] === "M" || c[0] === "L") add(c[1], c[2], m);
      else if (c[0] === "A") add(c[1], c[2], c[3] + m);
    }
  }
  return b;
}
function translatePath(path, dx, dy) {
  return path.map(c => (c[0] === "Z") ? c :
    (c[0] === "A") ? ["A", c[1] + dx, c[2] + dy, c[3], c[4], c[5], c[6]] : [c[0], c[1] + dx, c[2] + dy]);
}

/* ---------- aperture macro expressions ---------- */
function evalMacroExpr(src, vars) {
  const s = src.replace(/\s+/g, "");
  let i = 0;
  function num() {
    if (s[i] === "$") {
      i++; const m = /^\d+/.exec(s.slice(i)); i += m[0].length;
      return vars[+m[0]] || 0;
    }
    const m = /^[0-9.]+/.exec(s.slice(i));
    if (!m) throw new Error("マクロ式を読めません: " + src);
    i += m[0].length; return parseFloat(m[0]);
  }
  function factor() {
    if (s[i] === "+") { i++; return factor(); }
    if (s[i] === "-") { i++; return -factor(); }
    if (s[i] === "(") { i++; const v = expr(); i++; return v; }
    return num();
  }
  function term() {
    let v = factor();
    while (s[i] === "x" || s[i] === "X" || s[i] === "/") {
      const op = s[i++]; const r = factor();
      v = (op === "/") ? v / r : v * r;
    }
    return v;
  }
  function expr() {
    let v = term();
    while (s[i] === "+" || s[i] === "-") { const op = s[i++]; const r = term(); v = op === "+" ? v + r : v - r; }
    return v;
  }
  return expr();
}

/* ---------- Gerber (RS-274X) ---------- */
function parseGerber(text) {
  const st = {
    unit: 1, intDig: 2, decDig: 4, zeroOmit: "L", incremental: false,
    x: 0, y: 0, interp: "G01", quadrant: "G75", region: false,
    pol: "D", ap: null, warn: [],
  };
  const apertures = new Map();
  const macros = new Map();
  let items = [];
  const stack = [];             // open AB / SR blocks: { kind, items, ... }
  let contour = null;           // region contour under construction
  let regionPath = [];

  function convNum(s) {
    if (s.includes(".")) return parseFloat(s) * st.unit;
    let neg = false;
    if (s[0] === "+" || s[0] === "-") { neg = s[0] === "-"; s = s.slice(1); }
    if (st.zeroOmit === "T") s = s.padEnd(st.intDig + st.decDig, "0");
    const v = parseInt(s, 10) / Math.pow(10, st.decDig);
    return (neg ? -v : v) * st.unit;
  }
  function emit(it) { (stack.length ? stack[stack.length - 1].items : items).push(it); }

  function flashShape(ap, x, y) {
    if (!ap) return;
    if (ap.block) {
      for (const it of ap.block) emit({ pol: polOf(it.pol), kind: it.kind, width: it.width, path: translatePath(it.path, x, y) });
      return;
    }
    for (const sh of ap.shapes) {
      emit({ pol: sh.clear ? flip(st.pol) : st.pol, kind: sh.kind, width: sh.width, path: translatePath(sh.path, x, y) });
    }
  }
  const flip = p => (p === "D" ? "C" : "D");
  const polOf = p => (st.pol === "D" ? p : flip(p));

  function stdAperture(type, params) {
    const shapes = [];
    const holeOf = (i) => params[i] ? circlePath(0, 0, params[i] / 2, false) : [];
    if (type === "C") {
      shapes.push({ kind: "fill", path: circlePath(0, 0, params[0] / 2, true).concat(holeOf(1)) });
    } else if (type === "R") {
      const w = params[0] / 2, h = params[1] / 2;
      shapes.push({ kind: "fill", path: polyPath([[-w, -h], [w, -h], [w, h], [-w, h]], true).concat(holeOf(2)) });
    } else if (type === "O") {
      const w = params[0], h = params[1];
      const r = Math.min(w, h) / 2;
      let path;
      if (w >= h) {
        const d = w / 2 - r;
        path = [["M", -d, -r], ["L", d, -r], ["A", d, 0, r, -Math.PI / 2, Math.PI / 2, false],
                ["L", -d, r], ["A", -d, 0, r, Math.PI / 2, Math.PI * 1.5, false], ["Z"]];
      } else {
        const d = h / 2 - r;
        path = [["M", r, -d], ["L", r, d], ["A", 0, d, r, 0, Math.PI, false],
                ["L", -r, -d], ["A", 0, -d, r, Math.PI, Math.PI * 2, false], ["Z"]];
      }
      shapes.push({ kind: "fill", path: path.concat(holeOf(2)) });
    } else if (type === "P") {
      const r = params[0] / 2, n = Math.max(3, Math.round(params[1])), rot = params[2] || 0;
      const pts = [];
      for (let k = 0; k < n; k++) pts.push(rotPt(r, 0, rot + 360 * k / n));
      shapes.push({ kind: "fill", path: polyPath(pts, true).concat(holeOf(3)) });
    }
    return shapes;
  }

  function macroAperture(body, params) {
    const vars = [];
    params.forEach((v, i) => { vars[i + 1] = v; });
    const shapes = [];
    const ev = s => evalMacroExpr(s, vars);
    for (const raw of body) {
      const stmt = raw.trim();
      if (!stmt || stmt[0] === "0") continue;
      const asg = /^\$(\d+)=(.*)$/.exec(stmt);
      if (asg) { vars[+asg[1]] = ev(asg[2]); continue; }
      const a = stmt.split(",");
      const code = parseInt(a[0], 10);
      const v = a.slice(1).map(ev);
      // Macro values are in the file's unit; the unit factor is applied here.
      const u = st.unit;
      const clear = v[0] === 0;
      if (code === 1) {
        const [cx, cy] = rotPt(v[2] * u, v[3] * u, v[4] || 0);
        shapes.push({ clear, kind: "fill", path: circlePath(cx, cy, v[1] * u / 2, true) });
      } else if (code === 20 || code === 2) {
        const w = v[1] * u / 2, x1 = v[2] * u, y1 = v[3] * u, x2 = v[4] * u, y2 = v[5] * u;
        const len = Math.hypot(x2 - x1, y2 - y1) || 1;
        const nx = -(y2 - y1) / len * w, ny = (x2 - x1) / len * w;
        const pts = [[x1 + nx, y1 + ny], [x2 + nx, y2 + ny], [x2 - nx, y2 - ny], [x1 - nx, y1 - ny]].map(p => rotPt(p[0], p[1], v[6] || 0));
        shapes.push({ clear, kind: "fill", path: polyPath(pts, true) });
      } else if (code === 21) {
        const w = v[1] * u / 2, h = v[2] * u / 2, cx = v[3] * u, cy = v[4] * u;
        const pts = [[cx - w, cy - h], [cx + w, cy - h], [cx + w, cy + h], [cx - w, cy + h]].map(p => rotPt(p[0], p[1], v[5] || 0));
        shapes.push({ clear, kind: "fill", path: polyPath(pts, true) });
      } else if (code === 22) {
        const w = v[1] * u, h = v[2] * u, x = v[3] * u, y = v[4] * u;
        const pts = [[x, y], [x + w, y], [x + w, y + h], [x, y + h]].map(p => rotPt(p[0], p[1], v[5] || 0));
        shapes.push({ clear, kind: "fill", path: polyPath(pts, true) });
      } else if (code === 4) {
        const n = v[1], pts = [];
        for (let k = 0; k <= n; k++) pts.push(rotPt(v[2 + k * 2] * u, v[3 + k * 2] * u, v[4 + n * 2] || 0));
        pts.pop();
        shapes.push({ clear, kind: "fill", path: polyPath(pts, true) });
      } else if (code === 5) {
        const n = v[1], cx = v[2] * u, cy = v[3] * u, r = v[4] * u / 2, rot = v[5] || 0, pts = [];
        for (let k = 0; k < n; k++) { const [px, py] = rotPt(r, 0, 360 * k / n); pts.push(rotPt(cx + px, cy + py, rot)); }
        shapes.push({ clear, kind: "fill", path: polyPath(pts, true) });
      } else if (code === 6) {
        // Moire: drawn as its rings and crosshair, no exposure parameter.
        const cx = v[0] * u, cy = v[1] * u, od = v[2] * u, th = v[3] * u, gap = v[4] * u, nr = v[5];
        const cw = v[6] * u, cl = v[7] * u, rot = v[8] || 0;
        let d = od;
        for (let k = 0; k < nr && d > 0; k++) {
          const [rx, ry] = rotPt(cx, cy, rot);
          const inner = Math.max(0, d / 2 - th);
          shapes.push({ clear: false, kind: "fill", path: circlePath(rx, ry, d / 2, true).concat(inner > 0 ? circlePath(rx, ry, inner, false) : []) });
          d -= 2 * (th + gap);
        }
        for (const [w, h] of [[cl, cw], [cw, cl]]) {
          const pts = [[cx - w / 2, cy - h / 2], [cx + w / 2, cy - h / 2], [cx + w / 2, cy + h / 2], [cx - w / 2, cy + h / 2]].map(p => rotPt(p[0], p[1], rot));
          shapes.push({ clear: false, kind: "fill", path: polyPath(pts, true) });
        }
      } else if (code === 7) {
        // Thermal: a ring with four gaps; the gaps are cut by clear bars.
        const cx = v[0] * u, cy = v[1] * u, od = v[2] * u / 2, id = v[3] * u / 2, gap = v[4] * u / 2, rot = v[5] || 0;
        const [rx, ry] = rotPt(cx, cy, rot);
        shapes.push({ clear: false, kind: "fill", path: circlePath(rx, ry, od, true).concat(circlePath(rx, ry, id, false)) });
        for (const [w, h] of [[od, gap], [gap, od]]) {
          const pts = [[cx - w, cy - h], [cx + w, cy - h], [cx + w, cy + h], [cx - w, cy + h]].map(p => rotPt(p[0], p[1], rot));
          shapes.push({ clear: true, kind: "fill", path: polyPath(pts, true) });
        }
      } else {
        st.warn.push("未対応のマクロ図形 " + code);
      }
    }
    return shapes;
  }

  function arcPath(x0, y0, x1, y1, i, j, cw) {
    let cx, cy;
    if (st.quadrant === "G74") {
      // Single quadrant: the offsets are unsigned; pick the center that makes
      // both ends equidistant with a sweep of at most 90 degrees.
      let best = null;
      for (const [sx, sy] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) {
        const ccx = x0 + sx * Math.abs(i), ccy = y0 + sy * Math.abs(j);
        const r0 = Math.hypot(x0 - ccx, y0 - ccy), r1 = Math.hypot(x1 - ccx, y1 - ccy);
        let sweep = sweepOf(Math.atan2(y0 - ccy, x0 - ccx), Math.atan2(y1 - ccy, x1 - ccx), cw, false);
        if (sweep > Math.PI / 2 + 1e-6) continue;
        const err = Math.abs(r0 - r1);
        if (!best || err < best.err) best = { err, cx: ccx, cy: ccy };
      }
      if (!best) best = { cx: x0 + i, cy: y0 + j };
      cx = best.cx; cy = best.cy;
    } else {
      cx = x0 + i; cy = y0 + j;
    }
    const r = Math.hypot(x0 - cx, y0 - cy);
    const a0 = Math.atan2(y0 - cy, x0 - cx);
    const a1 = Math.atan2(y1 - cy, x1 - cx);
    const sweep = sweepOf(a0, a1, cw, st.quadrant !== "G74");
    const end = cw ? a0 - sweep : a0 + sweep;
    return ["A", cx, cy, r, a0, end, cw];
  }
  function sweepOf(a0, a1, cw, fullIfSame) {
    let d = cw ? a0 - a1 : a1 - a0;
    while (d < 0) d += Math.PI * 2;
    while (d >= Math.PI * 2) d -= Math.PI * 2;
    if (d < 1e-9 && fullIfSame) d = Math.PI * 2;
    return d;
  }

  function strokeSeg(seg) {
    const ap = st.ap;
    if (!ap) return;
    if (ap.type === "C" || !ap.shapes) {
      emit({ pol: st.pol, kind: "stroke", width: ap.type === "C" ? ap.params[0] : 0, path: seg });
    } else if (ap.type === "R" && seg[1][0] === "L") {
      // A rectangle dragged along a line sweeps the hull of its corners.
      const w = ap.params[0] / 2, h = ap.params[1] / 2;
      const [, xa, ya] = seg[0], [, xb, yb] = seg[1];
      const pts = [];
      for (const [x, y] of [[xa, ya], [xb, yb]]) pts.push([x - w, y - h], [x + w, y - h], [x + w, y + h], [x - w, y + h]);
      emit({ pol: st.pol, kind: "fill", path: polyPath(convexHull(pts), true) });
    } else {
      // Other apertures are rarely drawn with; trace with their nominal size.
      const size = ap.params && ap.params[0] || 0;
      emit({ pol: st.pol, kind: "stroke", width: size, path: seg });
    }
  }

  function closeContour() {
    if (contour && contour.length > 1) regionPath.push(...contour, ["Z"]);
    contour = null;
  }
  function finishRegion() {
    closeContour();
    if (regionPath.length) {
      emit({ pol: st.pol, kind: "fill", path: normalizeRegion(regionPath) });
    }
    regionPath = [];
  }

  function doCoord(word) {
    const get = (k) => { const m = new RegExp(k + "([+-]?[0-9.]+)").exec(word); return m ? convNum(m[1]) : null; };
    let nx = get("X"), ny = get("Y");
    const i = get("I") || 0, j = get("J") || 0;
    if (st.incremental) { nx = st.x + (nx || 0); ny = st.y + (ny || 0); }
    else { if (nx === null) nx = st.x; if (ny === null) ny = st.y; }
    const dm = /D0*([123])(?!\d)/.exec(word);
    const d = dm ? +dm[1] : st.lastD || 1;
    st.lastD = d;
    if (d === 1) {
      let seg;

let rafPending = false, dirty = true;

function requestRender() {

/* ---------- UI ---------- */
function setMsg(s) { document.getElementById("msg").textContent = s; }

async function loadFiles(fileList) {
  const entries = [];
  for (const f of fileList) {
    const buf = await f.arrayBuffer();
    if (/\.zip$/i.test(f.name)) {
      try {
        for (const e of await readZip(buf)) entries.push(e);
      } catch (e) { setMsg(f.name + ": " + e.message); }
    } else entries.push({ name: f.name, data: new Uint8Array(buf) });
  }
  const layers = [];
  for (const e of entries) {
    if (isJunkEntry(e.name)) continue;
    if (e.error) { layers.push({ name: e.name, type: "ignore", side: "all", error: e.error }); continue; }
    const L = loadLayerFile(e.name, e.data);
    if (L.parsed) {
      L.runs = compileLayer(L.parsed.items);
      L.bbox = itemsBBox(L.parsed.items);
      if (!isFinite(L.bbox.minX)) L.bbox = { minX: 0, minY: 0, maxX: 0, maxY: 0 };
    }
    L.visible = L.type !== "ignore";
    layers.push(L);
  }
  const order = ["copper", "mask", "silk", "paste", "outline", "drill", "other", "ignore"];
  layers.sort((a, b) => order.indexOf(a.type) - order.indexOf(b.type) || a.name.localeCompare(b.name));
  state.layers = layers;
  const warns = layers.filter(L => L.parsed && L.parsed.warnings.length).map(L => L.name.replace(/^.*\//, "") + ": " + L.parsed.warnings.join(", "));
  setMsg(warns.length ? "警告 — " + warns.join(" / ") : layers.length + " ファイルを読み込みました");
  buildLayerList();
  fitView();
  showSize();
  invalidate();
}
function showSize() {
  const b = boardBBox();
  document.getElementById("size").textContent = b ? "基板: " + (b.maxX - b.minX).toFixed(2) + " × " + (b.maxY - b.minY).toFixed(2) + " mm" : "";
}
function buildLayerList() {
  const box = document.getElementById("layers");
  box.innerHTML = "";
  if (!state.layers.length) { box.innerHTML = '<div class="empty">ファイルが読み込まれていません</div>'; return; }
  for (const L of state.layers) {
    const row = document.createElement("div");
    row.className = "row" + (L.error ? " err" : "");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = L.visible; cb.disabled = !L.parsed;
    cb.onchange = () => { L.visible = cb.checked; invalidate(); };
    const col = document.createElement("input");
    col.type = "color"; col.value = layerColor(L);
    col.oninput = () => { L.color = col.value; invalidate(); };
    const nm = document.createElement("span");
    nm.className = "name"; nm.textContent = L.name.replace(/^.*\//, "");
    nm.title = L.name + (L.error ? "\n" + L.error : "") + (L.parsed && L.parsed.warnings.length ? "\n" + L.parsed.warnings.join("\n") : "");
    const sel = document.createElement("select");
    for (const [t, label] of LAYER_TYPES) for (const [s, sl] of (t === "drill" ? DRILL_SIDES : SIDES)) {
      if (t === "drill") {
        const o = document.createElement("option");
        o.value = t + "/" + s; o.textContent = sl;
        sel.appendChild(o);
        continue;
      }
      const needsSide = ["copper", "mask", "silk", "paste"].includes(t);
      if (needsSide ? s === "all" : s !== "all") continue;
      const o = document.createElement("option");
      o.value = t + "/" + s; o.textContent = label + (needsSide ? "(" + sl + ")" : "");

document.getElementById("file").onchange = (e) => { if (e.target.files.length) loadFiles([...e.target.files]); e.target.value = ""; };
stage.addEventListener("dragover", (e) => { e.preventDefault(); stage.classList.add("drag"); });

stage.addEventListener("drop", (e) => { e.preventDefault(); stage.classList.remove("drag"); if (e.dataTransfer.files.length) loadFiles([...e.dataTransfer.files]); });
document.getElementById("fit").onclick = () => { fitView(); requestRender(); };
function setTheme(light) {
  state.light = light;
  document.body.classList.toggle("light", light);
  for (const o of document.querySelectorAll("#themes button")) o.classList.toggle("on", (o.dataset.theme === "light") === light);
  try { localStorage.setItem("gerberview.theme", light ? "light" : "dark"); } catch (e) {}

for (const b of document.querySelectorAll("#themes button")) b.onclick = () => setTheme(b.dataset.theme === "light");

for (const b of document.querySelectorAll("#modes button")) {
  b.onclick = () => {
    const prev = state.mode;
    state.mode = b.dataset.mode;
    for (const o of document.querySelectorAll("#modes button")) o.classList.toggle("on", o === b);
    // Keep the board where it was when the view mirrors.
    if (state.view && ((prev === "bottom") !== (state.mode === "bottom"))) {
      state.view.ox = stage.clientWidth - state.view.ox;
    }
    invalidate();
  };
}
stage.addEventListener("wheel", (e) => {
  if (!state.view) return;
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  const k = Math.exp(-e.deltaY * 0.0015);
  const v = state.view;
  v.ox = sx - (sx - v.ox) * k; v.oy = sy - (sy - v.oy) * k; v.scale *= k;
  requestRender();
}, { passive: false });
let drag = null;
stage.addEventListener("pointerdown", (e) => {
  if (!state.view) return;
  stage.setPointerCapture(e.pointerId);
  const r = stage.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  if (e.shiftKey) {
    const p = screenToBoard(sx, sy);
    state.measure = { a: p, b: p };
    drag = { measure: true };
  } else drag = { x: e.clientX, y: e.clientY };
});
stage.addEventListener("pointermove", (e) => {
  if (!state.view) return;
  const r = stage.getBoundingClientRect();
  const sx = e.clientX - r.left, sy = e.clientY - r.top;
  const [bx, by] = screenToBoard(sx, sy);
  document.getElementById("pos").textContent = "X: " + bx.toFixed(3) + " Y: " + by.toFixed(3) + " mm";
  if (!drag) return;
  if (drag.measure) {
    state.measure.b = [bx, by];
    const dx = bx - state.measure.a[0], dy = by - state.measure.a[1];
    document.getElementById("meas").textContent = "計測: " + Math.hypot(dx, dy).toFixed(3) + " mm (ΔX " + dx.toFixed(3) + ", ΔY " + dy.toFixed(3) + ")";
  } else {
    state.view.ox += e.clientX - drag.x; state.view.oy += e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
  }
  requestRender();
});
stage.addEventListener("pointerup", () => { drag = null; });
window.addEventListener("resize", requestRender);
invalidate();
